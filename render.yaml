databases:
  - name: wordigo-db
    databaseName: wordigo
    plan: free

services:
 
  # Backend API Service
  - type: web
    name: wordigo-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd wordigo-backend && npm install && npx prisma generate && npm run build
    startCommand: cd wordigo-backend && npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: wordigo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: wordigo-frontend
          property: host

  # Frontend Static Site
  - type: web
    name: wordigo-frontend
    env: static
    buildCommand: cd wordigo-web && npm install && npm run build
    staticPublishPath: wordigo-web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: wordigo-backend
          envVarKey: RENDER_EXTERNAL_URL
